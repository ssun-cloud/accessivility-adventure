<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2540">
  <meta name="description" content="동네를 여행하며 접근성 아이템을 찾아 환경을 바꾸는 1~2분 체험 게임">
  <title>우리 동네 접근성 모험</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <main id="stage" class="stage">
      <canvas id="view" role="img" aria-label="게임 화면"></canvas>

      <header class="hud">
        <p id="hudStage" class="hud-stage">START</p>
        <div class="hud-right">
          <div id="hudItems" class="hud-items" role="img" aria-label="접근성 아이템">
            <span class="hud-label" aria-hidden="true">접근성 아이템</span>
            <ol id="hudSlots" class="slots" aria-hidden="true"></ol>
          </div>
          <button id="muteBtn" class="mute" type="button" aria-pressed="false" aria-label="소리 끄기">
            <svg viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><path class="spk" d="M1 4h2l3-3v10L3 8H1z"/><path class="wave" d="M8 4h1v4H8zM10 2h1v8h-1z"/><path class="x" d="M8 3h1v1h1v1h1v2h-1v1H9v1H8V8h1V7h1V5H9V4H8z"/></svg>
          </button>
        </div>
      </header>

      <div id="titleCard" class="title-card" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
      <div id="complete" class="complete" hidden></div>
    </main>

    <section id="panel" class="panel" aria-label="안내와 선택"></section>
  </div>

  <div id="itemsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="itemsTitle" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="itemsTitle">내가 찾은 접근성 아이템</h2>
        <button type="button" class="btn btn-soft btn-small" data-close>닫기</button>
      </div>
      <ul id="itemsBody" class="found-list"></ul>
    </div>
  </div>

  <section id="campaign" class="campaign" aria-labelledby="cpTitle" hidden></section>

  <p id="sr" class="sr-only" aria-live="polite"></p>

  <!-- 1) 공용 도구 -->
  <script src="js/core/util.js"></script>
  <!-- 2) 스테이지 데이터 (캠페인 버전) : 첫 번째로 등록된 테마가 기본값 -->
  <!--    운영자 설정(버전 버튼 보이기 등) -->
  <script src="js/data/settings.js"></script>
  <script src="js/data/theme-village.js"></script>
  <script src="js/data/theme-film.js"></script>
  <script src="js/data/theme-school.js"></script>
  <!--    캠페인 참여 폼 설정(문구·저장 주소) -->
  <script src="js/data/campaign.js"></script>
  <!-- 3) 캐릭터·배경 그림 -->
  <script src="js/art/pixel.js"></script>
  <script src="js/art/characters.js"></script>
  <script src="js/art/world.js"></script>
  <!-- 4) 장면(스테이지 연출) -->
  <script src="js/scenes/entrance.js"></script>
  <script src="js/scenes/board.js"></script>
  <script src="js/scenes/infopoint.js"></script>
  <!-- 5) 효과음·애니메이션 -->
  <script src="js/fx/audio.js"></script>
  <script src="js/fx/particles.js"></script>
  <!-- 6) 엔진·화면 UI·진행 로직 -->
  <script src="js/core/engine.js"></script>
  <script src="js/ui/ui.js"></script>
  <!-- 7) 캠페인 참여 폼·Google Sheets 저장 -->
  <script src="js/campaign/sheets.js"></script>
  <script src="js/campaign/form.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
