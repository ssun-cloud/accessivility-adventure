<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2540">
  <meta name="description" content="동네를 여행하며 접근성 아이템을 찾아 환경을 바꾸는 1~2분 체험 게임">
  <title>우리 동네 접근성 모험</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap">
  <style>
/* =========================================================
 * css/style.css — 화면 UI 스타일
 * 레이아웃: 위 = 게임 화면(캔버스 + HUD), 아래 = 안내·선택 패널
 *          가로로 낮은 화면(휴대폰 가로)은 오른쪽에 패널
 * ========================================================= */
:root {
  --frame: #2b2540;      /* 화면 바깥 틀 */
  --ink: #2f2945;        /* 글자·테두리 */
  --ink-soft: #5b5074;
  --paper: #fff8ec;      /* 패널 바탕 */
  --paper-2: #f8ead2;
  --card: #ffffff;
  --sun: #ffd76c;        /* 강조(버튼) */
  --sun-2: #f1b640;
  --mint: #2b8f7c;
  --mint-bg: #daf4ed;
  --coral: #e0603f;
  --coral-bg: #ffe6dc;
  --sky: #a7d8f2;
  --focus: #1e63ff;
  --f-display: 'Do Hyeon', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-pixel: 'Silkscreen', 'Courier New', monospace;
  --shadow: 0 4px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--frame);
  color: var(--ink);
  font-family: var(--f-body);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; }
img.px-icon, .px-icon, .slot-icon, .fly-icon { image-rendering: pixelated; image-rendering: crisp-edges; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 전체 레이아웃 ---------- */
.app {
  height: 100%;
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--paper);
}
.stage {
  position: relative;
  flex: 0 0 auto;
  height: min(60%, 100vw);
  background: var(--sky);
  overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  background: var(--paper);
  border-top: 4px solid var(--ink);
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.panel-inner { max-width: 820px; margin: 0 auto; }

@media (min-aspect-ratio: 1/1) {
  .stage { flex: 1 1 auto; height: auto; min-height: 0; }
  .panel { flex: 0 0 auto; max-height: 48%; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .app { flex-direction: row; }
  .stage { flex: 1 1 auto; height: auto; }
  .panel { flex: 0 0 clamp(300px, 42%, 440px); max-height: none; border-top: 0; border-left: 4px solid var(--ink); padding-top: 10px; }
}

/* ---------- HUD ---------- */
.hud {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-stage {
  margin: 0;
  font-family: var(--f-pixel); font-weight: 700; font-size: clamp(13px, 2.4vw, 18px); letter-spacing: 0.06em;
  color: #fff; background: rgba(43, 37, 64, 0.88);
  border: 3px solid var(--ink); border-radius: 10px; padding: 5px 10px 4px;
  box-shadow: 0 3px 0 rgba(43, 37, 64, 0.45);
}
.hud-right { display: flex; gap: 8px; align-items: flex-start; }
.hud-items {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255, 250, 240, 0.94); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 8px 4px 10px;
  box-shadow: 0 3px 0 rgba(43, 37, 64, 0.45);
}
.hud-label { font-family: var(--f-display); font-size: clamp(13px, 2.3vw, 17px); white-space: nowrap; }
.slots { display: flex; gap: 5px; margin: 0; padding: 0; list-style: none; }
.slot-dot {
  display: grid; place-items: center;
  width: clamp(22px, 4vw, 30px); height: clamp(22px, 4vw, 30px);
  border-radius: 50%; border: 3px solid var(--ink); background: #fff;
}
.slot.got .slot-dot { background: var(--sun); animation: slotPop 0.5s ease-out; }
.slot-icon { width: 70%; height: 70%; }
@keyframes slotPop { 0% { transform: scale(0.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.mute {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: rgba(255, 250, 240, 0.94); border: 3px solid var(--ink); border-radius: 10px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(43, 37, 64, 0.45);
}
.mute svg { width: 22px; height: 22px; fill: var(--ink); }
.mute .x { display: none; }
.mute.is-muted .wave { display: none; }
.mute.is-muted .x { display: block; fill: var(--coral); }

/* ---------- 시작 타이틀 ---------- */
.title-card {
  position: absolute; left: 0; right: 0; top: 17%;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center; pointer-events: none; padding: 0 16px;
  animation: dropIn 0.7s cubic-bezier(.2, 1.4, .4, 1) both;
}
.title-card.is-leaving { animation: liftOut 0.4s ease-in both; }
.game-title {
  margin: 0;
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(34px, 8.4vw, 76px); line-height: 1.05; letter-spacing: 0.01em;
  color: #fff; text-wrap: balance;
  text-shadow:
    3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink),
    3px 3px var(--ink), -3px -3px var(--ink), 3px -3px var(--ink), -3px 3px var(--ink),
    0 8px 0 var(--ink);
}
.game-sub {
  margin: 0; font-family: var(--f-display); font-size: clamp(15px, 2.8vw, 22px);
  background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 3px;
  box-shadow: var(--shadow);
}
@keyframes dropIn { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes liftOut { to { transform: translateY(-40px); opacity: 0; } }

/* ---------- 공통 패널 요소 ---------- */
.eyebrow { margin: 0 0 2px; font-family: var(--f-pixel); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; color: var(--mint); text-transform: uppercase; }
.speech { display: flex; gap: 10px; align-items: flex-start; }
.speech .face { width: 52px; height: auto; flex: 0 0 auto; image-rendering: pixelated; margin-top: 4px; }
.speech > p, .speech > div {
  position: relative; margin: 0; flex: 1 1 auto; min-width: 0;
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px;
  box-shadow: var(--shadow);
}
.speech > p::before, .speech > div::before {
  content: ''; position: absolute; left: -11px; top: 16px; width: 14px; height: 14px;
  background: var(--card); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg);
}
.speech-text { font-family: var(--f-display); font-size: clamp(18px, 2.6vw, 23px); line-height: 1.45; }
.speech-lead { margin: 0 0 2px; font-size: 15px; color: var(--ink-soft); font-weight: 700; }
.speech-q { margin: 0; font-family: var(--f-display); font-size: clamp(19px, 2.7vw, 25px); line-height: 1.35; text-wrap: balance; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 10px 22px;
  font-family: var(--f-display); font-size: clamp(20px, 3vw, 26px);
  border: 3px solid var(--ink); border-radius: 14px; cursor: pointer;
  box-shadow: var(--shadow); transition: transform 0.08s, box-shadow 0.08s;
  touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-go { background: var(--sun); width: 100%; }
.btn-go:hover { background: #ffe08a; }
.btn-soft { background: var(--card); }
.btn-soft:hover { background: var(--paper-2); }
.btn-small { min-height: 44px; padding: 6px 14px; font-size: 18px; }
.btn-arrow { font-size: 0.7em; }

/* ---------- 경로 ---------- */
.route { display: flex; justify-content: space-between; gap: 4px; margin: 16px 0; padding: 0; list-style: none; }
.route-stop { position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.route-stop:not(:last-child)::after {
  content: ''; position: absolute; top: 20px; left: calc(50% + 24px); right: calc(-50% + 24px);
  border-top: 3px dashed var(--ink-soft);
}
.route-icon {
  width: 42px; height: 42px; display: grid; place-items: center;
  background: var(--card); border: 3px solid var(--ink); border-radius: 12px;
}
.route-icon img { width: 26px; height: 26px; }
.route-label { font-family: var(--f-display); font-size: 15px; white-space: nowrap; }
.route-stop.is-done .route-icon { background: var(--mint-bg); }
.route-stop.is-done .route-label::before { content: '✓ '; color: var(--mint); }
.route-stop.is-now .route-icon { background: var(--sun); transform: translateY(-3px); box-shadow: var(--shadow); }
.route.is-mini { margin: 10px 0 0; }
.route.is-mini .route-icon { width: 32px; height: 32px; border-radius: 9px; }
.route.is-mini .route-icon img { width: 20px; height: 20px; }
.route.is-mini .route-stop:not(:last-child)::after { top: 15px; left: calc(50% + 19px); right: calc(-50% + 19px); }
.route.is-mini .route-label { font-size: 13px; }

/* ---------- 시작 ---------- */
.p-start { display: flex; flex-direction: column; }
.theme-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; justify-content: center; }
.theme-switch-label { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-right: 2px; }
.chip {
  min-height: 36px; padding: 4px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card);
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip[aria-pressed="true"]::before { content: '● '; color: var(--sun); }

/* ---------- 이동 ---------- */
.p-travel { text-align: center; padding: 6px 0; }
.travel-title { margin: 0; font-family: var(--f-display); font-size: clamp(24px, 4vw, 34px); line-height: 1.2; text-wrap: balance; }
.travel-sub { margin: 4px 0 0; color: var(--ink-soft); font-weight: 700; font-size: 15px; }

/* ---------- 질문·선택지 ---------- */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) { .choices { grid-template-columns: repeat(4, 1fr); } }
.choice {
  position: relative; display: flex; align-items: center; gap: 10px; text-align: left;
  min-height: 68px; padding: 10px 12px 10px 10px;
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px; cursor: pointer;
  box-shadow: var(--shadow); transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  touch-action: manipulation;
}
.choice:hover:not(:disabled) { background: #fffbef; }
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.choice-num {
  position: absolute; top: -9px; left: -7px; width: 22px; height: 22px; display: grid; place-items: center;
  font-family: var(--f-pixel); font-size: 12px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 6px;
}
.choice-icon { flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center; background: var(--mint-bg); border: 2px solid var(--ink); border-radius: 10px; }
.choice-icon img { width: 30px; height: 30px; }
.choice-label { flex: 1 1 auto; min-width: 0; font-family: var(--f-display); font-size: clamp(18px, 2.5vw, 22px); line-height: 1.2; word-break: keep-all; }
.choice-state { position: absolute; top: -11px; right: -6px; font-size: 13px; font-weight: 900; border-radius: 999px; padding: 1px 8px; border: 2px solid var(--ink); display: none; }
.choice.is-tried { background: var(--paper-2); border-style: dashed; box-shadow: 0 2px 0 var(--ink-soft); }
.choice.is-tried .choice-icon { filter: grayscale(0.7); opacity: 0.75; }
.choice.is-tried .choice-state { display: block; background: var(--coral-bg); color: #9b3a1f; }
.choice.is-picked { background: var(--mint-bg); border-width: 4px; }
.choice.is-picked .choice-state { display: block; background: var(--mint); color: #fff; }
.choice:disabled { cursor: default; }
.choice:disabled:not(.is-picked) { opacity: 0.5; }
.choice.wobble { animation: wobble 0.45s ease; }
@keyframes wobble { 0%, 100% { transform: none; } 25% { transform: translateX(-4px) rotate(-1deg); } 60% { transform: translateX(4px) rotate(1deg); } }

.feedback { min-height: 1.4em; margin: 12px 0 0; font-size: 16px; line-height: 1.5; }
.feedback.is-retry { background: var(--coral-bg); border: 2px dashed #c4583a; border-radius: 12px; padding: 8px 12px; }
.feedback.is-retry .fb-main { display: block; font-weight: 700; }
.feedback.is-retry .fb-hint { display: block; color: var(--ink-soft); margin-top: 2px; }
.feedback.is-retry .fb-hint::before { content: '→ '; }
.feedback.is-good { background: var(--mint-bg); border: 2px solid var(--mint); border-radius: 12px; padding: 8px 12px; }

/* ---------- 아이템 카드 ---------- */
.item-card, .found-card { display: flex; gap: 14px; align-items: flex-start; }
.item-badge {
  flex: 0 0 auto; width: 76px; height: 76px; display: grid; place-items: center;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 50%;
  box-shadow: var(--shadow);
}
.item-badge img { width: 46px; height: 46px; }
.item-text { min-width: 0; }
.item-name { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 3.6vw, 32px); line-height: 1.15; }
.item-desc { margin: 6px 0 0; font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55; font-weight: 700; }
.item-note { margin: 8px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink-soft); padding-left: 10px; border-left: 4px solid var(--sun-2); }
.p-item .btn-go { margin-top: 16px; }

/* ---------- 엔딩 ---------- */
.p-end { text-align: center; }
.end-sub { margin: 0; font-family: var(--f-display); font-size: clamp(22px, 3.6vw, 30px); }
.end-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0; padding: 0; list-style: none; }
.end-items li { display: flex; align-items: center; gap: 6px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; font-family: var(--f-display); font-size: 18px; }
.end-items img { width: 28px; height: 28px; background: var(--sun); border-radius: 50%; padding: 3px; border: 2px solid var(--ink); }
.end-msg { margin: 0 auto 14px; max-width: 34em; font-size: clamp(16px, 2.3vw, 19px); line-height: 1.6; font-weight: 700; text-wrap: balance; }
.end-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.end-btns .btn { width: 100%; font-size: clamp(18px, 2.6vw, 24px); white-space: nowrap; padding-inline: 12px; }

/* ---------- 게임 화면 위 알림 ---------- */
.toast {
  position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center;
  width: max-content; max-width: calc(100% - 24px);
  background: var(--paper); border: 4px solid var(--ink); border-radius: 16px; padding: 8px 18px 8px 10px;
  box-shadow: 0 5px 0 var(--ink); pointer-events: none;
  animation: toastIn 0.45s cubic-bezier(.2, 1.5, .4, 1) both;
}
.toast.is-out { animation: toastOut 0.35s ease-in both; }
.toast-kicker { grid-column: 2; margin: 0; font-family: var(--f-display); font-size: clamp(15px, 2.4vw, 19px); color: var(--mint); }
.toast-badge { grid-column: 1; grid-row: 1 / span 2; width: 54px; height: 54px; display: grid; place-items: center; background: var(--sun); border: 3px solid var(--ink); border-radius: 50%; }
.toast-badge img { width: 32px; height: 32px; }
.toast-name { grid-column: 2; margin: 0; font-family: var(--f-display); font-size: clamp(20px, 3.4vw, 28px); line-height: 1.1; }
@keyframes toastIn { from { transform: translate(-50%, -16px) scale(0.7); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
@keyframes toastOut { to { transform: translate(-50%, -16px) scale(0.9); opacity: 0; } }

.complete {
  position: absolute; left: 0; right: 0; top: 18%; text-align: center; pointer-events: none; padding: 0 12px;
  animation: dropIn 0.8s cubic-bezier(.2, 1.4, .4, 1) both;
}
.complete-title {
  display: inline-block; margin: 0;
  font-family: var(--f-pixel); font-weight: 700; font-size: clamp(22px, 6vw, 56px); letter-spacing: 0.02em; line-height: 1.1;
  color: var(--sun);
  text-shadow:
    3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink),
    3px 3px var(--ink), -3px -3px var(--ink), 3px -3px var(--ink), -3px 3px var(--ink),
    0 7px 0 var(--ink);
  animation: float 2.4s ease-in-out infinite 0.8s;
}
@keyframes float { 50% { transform: translateY(-5px); } }

.fly-icon {
  position: fixed; z-index: 30; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none;
  background: var(--sun); border: 3px solid var(--ink); border-radius: 50%; padding: 6px;
  transition: transform 0.9s cubic-bezier(.5, -0.3, .6, 1), opacity 0.9s ease-in;
}

/* ---------- 아이템 모아보기 ---------- */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(43, 37, 64, 0.62); }
.modal-card {
  width: min(600px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; padding: 16px 18px 20px; box-shadow: 0 6px 0 var(--ink);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.modal-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.found-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.found-card { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 12px; }
.found-card .item-badge { width: 60px; height: 60px; box-shadow: none; }
.found-card .item-badge img { width: 36px; height: 36px; }
.found-card .item-name { font-size: 24px; }

/* ---------- 좁은 화면 다듬기 ---------- */
@media (max-width: 420px) {
  .panel { padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .choices { gap: 9px; }
  .choice { min-height: 64px; gap: 8px; padding: 8px 8px 8px 8px; }
  .choice-icon { width: 38px; height: 38px; }
  .choice-icon img { width: 26px; height: 26px; }
  .hud-label { font-size: 13px; }
  .hud-items { gap: 6px; padding: 3px 6px 3px 8px; }
  .slot-dot { width: 21px; height: 21px; border-width: 2px; }
  .end-btns { grid-template-columns: 1fr; }
  .route-label { font-size: 13px; }
  .route-icon { width: 36px; height: 36px; }
  .route-icon img { width: 22px; height: 22px; }
  .route-stop:not(:last-child)::after { top: 17px; left: calc(50% + 21px); right: calc(-50% + 21px); }
  .speech .face { width: 42px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .choices { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .choice { min-height: 56px; }
  .speech-q { font-size: 18px; }
  .speech .face { display: none; }
  .speech > div::before, .speech > p::before { display: none; }
  .route { margin: 10px 0; }
  .end-btns { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .toast { top: 54px; padding: 5px 12px 5px 6px; border-width: 3px; }
  .toast-badge { width: 40px; height: 40px; }
  .toast-badge img { width: 24px; height: 24px; }
  .toast-name { font-size: 18px; }

      px.R(b, lx0 + i, Math.round(90 + 4 * tt * (1 - tt) * 7), 1, 1, P.ink2);
    }
    const lit = Z.lit || 0;
    for (let k = 0; k < n; k++) {
      const tt = (k + 0.5) / n, bx = Math.round(lx0 + (lx1 - lx0) * tt), by = Math.round(90 + 4 * tt * (1 - tt) * 7) + 1;
      const st = stars[Math.floor(k / per)], on = k < lit;
      let col = P.metal;
      if (on) col = st && st.air ? ['#ffe27a', '#ffb3c7', '#9fe6d6', '#b9d2ff'][(Math.floor(t * 3) + k) % 4] : '#ffe27a';
      if (on) { b.save(); b.globalAlpha = 0.45; px.disc(b, bx + 1, by + 2, 4, '#fff6c8'); b.restore(); }
      px.R(b, bx, by - 1, 3, 1, P.ink2); px.R(b, bx - 1, by, 5, 4, P.ink); px.R(b, bx, by, 3, 3, col);
      if (on) px.R(b, bx, by, 1, 1, '#ffffff');
    }
    // 풍선
    [[x + 64, 96, P.pink], [x + 186, 90, P.blue], [x + 196, 98, P.yellow]].forEach((p, i) => {
      const by = p[1] + Math.round(Math.sin(t * 1.6 + i) * 1.5);
      px.line(b, p[0], by + 6, p[0] + 1, 132, P.ink2);
      px.ball(b, p[0], by, 5, p[2]); px.R(b, p[0] - 2, by - 3, 2, 2, '#ffffff');
    });
  }

  /* ---------- 공개 함수 ---------- */
  world.drawBack = function (b, G) {
    const V = G.view, W = G.W, t = G.time;
    sky(b, V, t);
    far(b, V);
    ground(b, V);
    const vis = (x0, x1) => x1 > V.L - 20 && x0 < V.L + V.bw + 20;
    if (vis(W.home.x, W.home.x + W.home.w)) home(b, W.home, G);
    W.fillers.forEach(F => { if (vis(F.x, F.x + F.w)) filler(b, F, G); });
    W.scenes.forEach(sc => { if (vis(sc.x - 30, sc.x + sc.w + 30)) sc.def.draw(b, sc.st, G); });
    if (vis(W.plaza.x, W.plaza.x + W.plaza.w)) plaza(b, W.plaza, G, t);
  };
  world.drawFront = function (b, G) {
    const V = G.view, W = G.W;
    wires(b, W, V);
    W.poles.forEach(x => { if (x > V.L - 12 && x < V.L + V.bw + 12) pole(b, x); });
    W.trees.forEach(x => { if (x > V.L - 30 && x < V.L + V.bw + 30) tree(b, x, G.time); });
    W.scenes.forEach(sc => { if (sc.def.drawFront) sc.def.drawFront(b, sc.st, G); });
  };
})(window.AAG);

  <script>
/* =========================================================
 * scenes/entrance.js — 장면 ① 입구 계단 → 경사로
 * place.style : 'shop'(동네 가게) | 'theater'(영화관) | 'school'(학교)
 * ========================================================= */
(function (A) {
  'use strict';
  const P = A.pal, px = A.px, WD = A.WD;

  const STY = {
    shop: { wall: '#fdeed3', band: '#efd6ad', sign: P.mint2, signText: '#ffffff', awn: [P.coral, '#fff7ea'], trim: '#f3d9ae', win: 'goods' },
    theater: { wall: '#a171a6', band: '#7b4f82', sign: P.yellow, signText: P.ink, awn: null, trim: '#caa0cf', bulbs: true, win: 'posters' },
    school: { wall: '#f4e7c6', band: '#e2cfa3', sign: P.leaf2, signText: '#ffffff', awn: null, trim: '#e6d3a9', clock: true, win: 'class' }
  };
  const FLOOR = 139; // 문턱(층) 높이

  function geo(st) {
    const x = st.x;
    return { stop: x + 10, rx0: x + 18, rx1: x + 70, l0: x + 70, l1: x + 110, d0: x + 79, d1: x + 101, dc: x + 90, b0: x + 30, b1: x + 184 };
  }
  const rampY = (g, x) => WD.LANE + (FLOOR - WD.LANE) * (x - g.rx0) / (g.rx1 - g.rx0);

  function drawRamp(b, g, p) {
    if (p <= 0) return;
    const xs = Math.round(g.rx1 - (g.rx1 - g.rx0) * p);
    for (let x = xs; x <= g.rx1; x++) {
      const ty = Math.round(rampY(g, x));
      px.R(b, x, ty - 1, 1, 1, P.ink);
      px.R(b, x, ty, 1, 2, (x - g.rx0) % 6 === 0 ? '#ddd0b8' : '#f3eadb');
      px.R(b, x, ty + 2, 1, WD.LANE - ty - 1, '#d5c5a6');
      px.R(b, x, ty + 2, 1, 1, '#c3b190');
      px.R(b, x, WD.LANE + 1, 1, 1, P.ink);
    }
    const ty0 = Math.round(rampY(g, xs));
    px.R(b, xs - 1, ty0 - 1, 1, WD.LANE - ty0 + 3, P.ink);
    if (p > 0.6) {
      b.save(); b.globalAlpha = Math.min(1, (p - 0.6) / 0.35);
      for (let x = g.rx0 + 3; x < g.rx1 - 2; x += 13) {
        const ty = Math.round(rampY(g, x));
        px.R(b, x, ty - 12, 2, 12, P.ink); px.R(b, x, ty - 11, 1, 11, P.metal2);
      }
      for (let x = g.rx0 + 3; x <= g.rx1 + 6; x++) {
        const ty = x <= g.rx1 ? Math.round(rampY(g, x)) : FLOOR;
        px.R(b, x, ty - 13, 1, 2, P.ink); px.R(b, x, ty - 13, 1, 1, '#e7ecf4');
      }
      px.R(b, g.rx1 + 6, FLOOR - 13, 2, 13, P.ink);
      b.restore();
    }
  }

  A.registerScene('entrance', {
    width: () => 192,
    init(stage, x) { return { x, stage, style: (stage.place && stage.place.style) || 'shop', ramp: 0, door: 0, solved: false }; },
    setup() {},
    stopX(st) { return geo(st).stop; },
    focus(st) { return { x: geo(st).stop + 56, y: 118, z: 1.45 }; },
    boxPos(st) { const g = geo(st); return { x: g.rx0 + 30, y: 122 }; },
    tag(st) { const g = geo(st); return { x: (g.rx0 + g.rx1) / 2 + 4, y: 110 }; },
    describe(st) { const a = st.stage.a11y || {}; return st.solved ? (a.after || '') : (a.before || ''); },

    draw(b, st, G) {
      const g = geo(st), S = STY[st.style] || STY.shop, top = 58, t = G.time;
      // 벽
      px.box(b, g.b0, top, g.b1 - g.b0, WD.BASE - top + 1, S.wall);
      px.R(b, g.b0 + 1, WD.BASE - 8, g.b1 - g.b0 - 2, 7, S.band);
      px.R(b, g.b0 - 2, top - 3, g.b1 - g.b0 + 4, 6, S.trim); px.R(b, g.b0 - 2, top - 4, g.b1 - g.b0 + 4, 1, P.ink); px.R(b, g.b0 - 2, top + 3, g.b1 - g.b0 + 4, 1, P.ink2);
      if (S.clock) {
        const cx = (g.b0 + g.b1) / 2;
        px.box(b, cx - 12, top - 20, 24, 18, S.trim); px.ball(b, cx, top - 11, 6, '#ffffff'); px.R(b, cx, top - 15, 1, 4, P.ink); px.R(b, cx, top - 11, 3, 1, P.ink);
      }
      // 간판
      const sx0 = g.b0 + 12, sx1 = g.b1 - 12;
      px.box(b, sx0, 66, sx1 - sx0, 17, S.sign); px.R(b, sx0 + 1, 67, sx1 - sx0 - 2, 1, 'rgba(255,255,255,0.35)');
      if (S.bulbs) for (let i = sx0 + 3; i < sx1 - 2; i += 6) px.R(b, i, 64, 2, 2, (Math.floor(t * 3) + i / 6) % 2 < 1 ? '#fff6c0' : P.yellow2);
      G.label({ x: (sx0 + sx1) / 2, y: 74.5, text: st.stage.place.sign, size: 10, color: S.signText });
      // 차양
      if (S.awn) {
        const a0 = g.b0 + 4, a1 = g.b1 - 4;
        px.R(b, a0, 87, a1 - a0, 1, P.ink);
        for (let x = a0, i = 0; x < a1; x += 7, i++) {
          const w = Math.min(7, a1 - x), c = S.awn[i % 2];
          px.R(b, x, 88, w, 8, c); px.R(b, x + 1, 96, Math.max(0, w - 2), 2, c); px.R(b, x + 1, 98, Math.max(0, w - 2), 1, P.ink);
        }
      }
      // 왼쪽 작은 창 + OPEN
      px.box(b, g.b0 + 8, 102, 30, 22, P.glass); px.R(b, g.b0 + 10, 104, 3, 8, P.glassHi);
      px.box(b, g.b0 + 17, 108, 18, 8, '#ffffff'); G.label({ x: g.b0 + 26, y: 112, text: 'OPEN', size: 4, color: P.coral, font: 'pixel' });
      // 문
      px.R(b, g.d0 - 2, 101, g.d1 - g.d0 + 4, FLOOR - 101 + 1, P.ink);
      px.R(b, g.d0 - 1, 102, g.d1 - g.d0 + 2, FLOOR - 102, S.trim);
      const dw = g.d1 - g.d0, pw = dw / 2, open = Math.round(st.door * (pw - 2));
      px.R(b, g.d0, 103, dw, FLOOR - 103, P.inside);
      px.R(b, g.d0 + 2, 118, dw - 4, 2, '#7d7599');
      const pane = (x0, w) => { if (w <= 0) return; px.R(b, x0, 103, w, FLOOR - 103, P.ink); px.R(b, x0 + (w > 2 ? 1 : 0), 104, Math.max(1, w - 2), FLOOR - 105, P.glass2); if (w > 4) px.R(b, x0 + 2, 106, 2, 10, P.glassHi); };
      pane(g.d0, pw - open); pane(g.d0 + pw + open, pw - open);
      // 오른쪽 진열창
      const w0 = g.d1 + 10, w1 = g.b1 - 8;
      px.box(b, w0, 100, w1 - w0, 38, P.glass);
      if (S.win === 'goods') {
        [112, 124].forEach((sy, r) => {
          px.R(b, w0 + 2, sy + 8, w1 - w0 - 4, 2, P.wood2);
          for (let i = w0 + 5; i < w1 - 8; i += 9) px.box(b, i, sy + (i % 2), 7, 8 - (i % 2), [P.yellow, P.coral, P.leaf3, P.pink, P.blue][(i / 9 + r) % 5 | 0]);
        });
      } else if (S.win === 'posters') {
        for (let i = 0; i < 3; i++) { px.box(b, w0 + 5 + i * 22, 104, 18, 28, ['#3f5da8', '#e27d5b', '#44b8a0'][i]); px.disc(b, w0 + 14 + i * 22, 114, 4, '#fff0b8'); }
      } else {
        px.R(b, w0 + 1, 118, w1 - w0 - 2, 1, '#ffffff');
        for (let i = w0 + 6; i < w1 - 6; i += 14) { px.R(b, i, 128, 10, 2, P.wood); px.R(b, i + 4, 130, 2, 7, P.wood2); }
      }
      px.R(b, w0 + 2, 102, 3, 12, P.glassHi);
      // 문턱 앞 단(랜딩)
      px.R(b, g.l0, FLOOR - 1, g.l1 - g.l0, 4, P.ink);
      px.R(b, g.l0 + 1, FLOOR, g.l1 - g.l0 - 2, 2, '#f3eadb');
      px.R(b, g.l0, FLOOR + 3, g.l1 - g.l0, WD.BASE - FLOOR - 2, P.ink);
      px.R(b, g.l0 + 1, FLOOR + 3, g.l1 - g.l0 - 2, WD.BASE - FLOOR - 3, '#d9cbb0');
      // 계단 3칸 (정면)
      const hs = [7, 7, 6];
      let sy = FLOOR + 3;
      for (let i = 0; i < 3; i++) {
        const hw = 14 + i * 3, h = hs[i];
        px.R(b, g.dc - hw - 1, sy, hw * 2 + 2, h + 1, P.ink);
        px.R(b, g.dc - hw, sy, hw * 2, 2, '#f6eee2');
        px.R(b, g.dc - hw, sy + 2, hw * 2, h - 2, '#d7c7aa');
        sy += h;
      }
      drawRamp(b, g, st.ramp);
    },

    async solve(G, st) {
      const g = geo(st);
      G.sfx('build');
      await G.tween(st, { ramp: 1 }, 1500, 'out', () => {
        const xs = g.rx1 - (g.rx1 - g.rx0) * st.ramp;
        if (Math.random() < 0.5) G.emit(xs, rampY(g, xs) - 2, 'spark');
      });
      st.solved = true;
      G.burst((g.rx0 + g.rx1) / 2, 146, 'spark', 18);
    },

    async leave(G, st) {
      const g = geo(st), h = G.hero;
      await G.walkTo(g.rx0);
      await G.walkPath([[g.rx1, FLOOR], [g.dc - 1, FLOOR]], 30);
      G.sfx('door');
      await G.tween(st, { door: 1 }, 350);
      await G.tween(h, { alpha: 0 }, 250);
      await G.wait(550);
      h.carry = 'bag';
      G.burst(g.dc, 118, 'note', 3);
      await G.tween(h, { alpha: 1 }, 250);
      G.tween(st, { door: 0 }, 350);
      await G.hopTo(g.dc + 4, FLOOR + 7);
      await G.hopTo(g.dc + 8, FLOOR + 14);
      await G.hopTo(g.dc + 12, WD.LANE);
      G.follow = true;
      await G.walkTo(st.x + 192 + 4);
    },

    ending(G, st) {
      const g = geo(st);
      G.addActor({ look: 'rider', ride: 'wheelchair', x: g.rx0 - 26, y: WD.LANE, dir: 1, speed: 14, pause: 1.4,
        route: [[g.rx0 - 26, WD.LANE], [g.rx0, WD.LANE], [g.rx1, FLOOR], [g.dc - 6, FLOOR]] });
      G.addActor({ look: 'parent', ride: 'stroller', x: st.x + 150, y: WD.LANE + 3, dir: -1, speed: 12, pause: 1,
        route: [[st.x + 150, WD.LANE + 3], [st.x - 30, WD.LANE + 3]] });
    }
  });
})(window.AAG);

  <script>
/* =========================================================
 * scenes/board.js — 장면 ② 소리로만 나오던 안내 → 글자 안내가 켜짐
 * variant : 'busstop'(버스정류장 전광판) | 'screen'(야외 스크린 자막)
 * ========================================================= */
(function (A) {
  'use strict';
  const P = A.pal, px = A.px, WD = A.WD;
  A.art = A.art || {};

  /* 스크린 속 영화 장면(바닷가 노을) — 실내 장면에서도 같이 씁니다 */
  A.art.movie = function (b, x, y, w, h, t) {
    const bands = ['#ffb38a', '#ffc99a', '#ffdcae', '#ffe9c4'];
    const sea = y + Math.round(h * 0.62);
    for (let i = 0; i < 4; i++) px.R(b, x, y + Math.round((sea - y) * i / 4), w, Math.ceil((sea - y) / 4) + 1, bands[i]);
    px.disc(b, x + w * 0.68, sea - 4, Math.round(h * 0.14), '#fff3c9');
    px.R(b, x, sea, w, y + h - sea, '#6fa8d8');
    for (let i = 0; i < 6; i++) {
      const wy = sea + 3 + (i % 3) * 4, wx = x + ((i * 23 + Math.floor(t * 8)) % Math.max(1, w - 10));
      px.R(b, wx, wy, 8, 1, '#a9d1f0');
    }
    px.R(b, x, y + h - 5, w, 5, '#f3d9a6');
    const fx = x + Math.round(w * 0.3 + Math.sin(t * 0.4) * 3);
    [[0, '#3a3150'], [7, '#5b5074']].forEach(p => { px.R(b, fx + p[0], y + h - 14, 3, 9, p[1]); px.R(b, fx + p[0], y + h - 17, 3, 3, p[1]); });
  };

  function geo(st) {
    const x = st.x;
    if (st.variant === 'screen') return { stop: x + 76, sc0: x + 20, sc1: x + 136, sy0: 58, sy1: 128, pole: x + 156, bx0: x + 26, bx1: x + 130, by0: 116, by1: 126 };
    return { stop: x + 58, s0: x + 18, s1: x + 124, pole: x + 140, bx0: x + 32, bx1: x + 110, by0: 99, by1: 111 };
  }

  function waves(b, x, y, t, strength) {
    if (strength <= 0) return;
    for (let i = 0; i < 3; i++) {
      const ph = (t * 1.6 + i / 3) % 1, r = 3 + ph * 10;
      b.save(); b.globalAlpha = (1 - ph) * strength;
      for (let a = -0.7; a <= 0.7; a += 0.12) px.R(b, x + Math.cos(a) * r, y + Math.sin(a) * r, 1, 1, P.ink2);
      b.restore();
    }
  }

  function drawBusstop(b, st, G, g) {
    const t = G.time;
    // 뒷 유리 벽
    px.box(b, g.s0 + 4, 100, g.s1 - g.s0 - 8, 48, P.glass);
    for (let i = 0; i < 3; i++) px.line(b, g.s0 + 12 + i * 6, 140, g.s0 + 28 + i * 6, 104, P.glassHi);
    // 포스터
    px.box(b, g.s1 - 32, 104, 22, 34, P.pink);
    px.disc(b, g.s1 - 21, 115, 5, P.yellow); px.R(b, g.s1 - 29, 124, 16, 10, P.mint);
    G.label({ x: g.s1 - 21, y: 131, text: G.theme.world.poster || '', size: 3.4, color: '#ffffff' });
    // 벤치
    px.R(b, g.s0 + 12, 134, 50, 5, P.ink); px.R(b, g.s0 + 13, 135, 48, 3, P.wood3);
    px.R(b, g.s0 + 16, 139, 3, 11, P.ink); px.R(b, g.s0 + 56, 139, 3, 11, P.ink);
    // 기둥
    [g.s0, g.s1 - 4].forEach(x => { px.R(b, x, 94, 4, WD.BASE - 92, P.ink); px.R(b, x + 1, 94, 2, WD.BASE - 93, P.metal2); });
    // 지붕
    px.box(b, g.s0 - 6, 87, g.s1 - g.s0 + 12, 9, P.mint2);
    px.R(b, g.s0 - 5, 88, g.s1 - g.s0 + 10, 2, P.mint);
    px.R(b, g.s0 - 5, 96, g.s1 - g.s0 + 10, 1, P.mintDk);
    // 전광판
    px.R(b, g.bx0 + 6, 96, 1, 3, P.ink); px.R(b, g.bx1 - 7, 96, 1, 3, P.ink);
    px.box(b, g.bx0, g.by0, g.bx1 - g.bx0, g.by1 - g.by0, P.dark);
    const on = st.led >= 1 || (st.led > 0 && Math.floor(t * 18) % 3 !== 0);
    px.R(b, g.bx0 + 1, g.by0 + 1, g.bx1 - g.bx0 - 2, g.by1 - g.by0 - 2, on ? '#2a1c12' : P.dark2);
    if (!on) for (let i = g.bx0 + 3; i < g.bx1 - 2; i += 3) px.R(b, i, (g.by0 + g.by1) / 2, 1, 1, '#4d4863');
    if (on) {
      G.label({ x: g.bx0 + 2, y: (g.by0 + g.by1) / 2 + 0.3, text: st.stage.message, size: 7.4, color: P.led, font: 'body', weight: 700, align: 'left', glow: P.led,
        clip: { x: g.bx0 + 1, y: g.by0 + 1, w: g.bx1 - g.bx0 - 2, h: g.by1 - g.by0 - 2 }, marquee: 26 });
    }
    // 버스 표지판 기둥
    const p = g.pole;
    px.R(b, p - 1, 60, 4, WD.LANE - 60 - 2, P.ink); px.R(b, p, 60, 2, WD.LANE - 62, P.metal2);
    px.R(b, p - 4, WD.LANE - 3, 10, 3, P.ink2);
    px.ball(b, p + 1, 66, 8, P.blue3); px.disc(b, p + 1, 66, 6, '#ffffff');
    px.R(b, p - 3, 63, 9, 5, P.mint2); px.R(b, p - 2, 64, 2, 2, P.glass); px.R(b, p + 1, 64, 2, 2, P.glass); px.R(b, p - 2, 68, 2, 1, P.ink); px.R(b, p + 3, 68, 2, 1, P.ink);
    px.box(b, p - 7, 76, 17, 22, '#ffffff');
    G.label({ x: p + 1.5, y: 80.5, text: (st.stage.place && st.stage.place.route) || '', size: 5, color: P.blue3, font: 'pixel' });
    for (let i = 0; i < 4; i++) px.R(b, p - 4, 85 + i * 3, 11, 1, P.metal2);
    // 스피커
    px.box(b, p + 2, 102, 6, 7, P.metal2); px.R(b, p + 8, 101, 2, 9, P.ink2); px.R(b, p + 10, 100, 1, 11, P.ink2);
    waves(b, p + 12, 105, t, st.waves);
    if (st.chime > 0) G.label({ x: p - 16, y: 80, text: '🔊 ' + (st.stage.sound || '띵동~'), size: 6.4, color: P.ink, bg: '#ffffff', border: P.ink, pad: 2.2, bubble: 'right', alpha: st.chime });
  }

  function drawScreen(b, st, G, g) {
    const t = G.time;
    // 다리
    px.R(b, g.sc0 + 12, g.sy1, 4, WD.BASE - g.sy1 + 4, P.ink); px.R(b, g.sc1 - 16, g.sy1, 4, WD.BASE - g.sy1 + 4, P.ink);
    px.R(b, g.sc0 + 13, g.sy1, 2, WD.BASE - g.sy1 + 3, P.metal); px.R(b, g.sc1 - 15, g.sy1, 2, WD.BASE - g.sy1 + 3, P.metal);
    // 테두리 + 화면
    px.box(b, g.sc0 - 3, g.sy0 - 3, g.sc1 - g.sc0 + 6, g.sy1 - g.sy0 + 6, P.dark);
    A.art.movie(b, g.sc0, g.sy0, g.sc1 - g.sc0, g.sy1 - g.sy0, t);
    // 이름표

    focus(st) { const g = geo(st); return st.variant === 'screen' ? { x: g.stop + 6, y: 110, z: 1.55 } : { x: g.stop + 30, y: 112, z: 1.5 }; },

  const room = st => ROOMS[st.variant] || ROOMS.cafe;

      px.R(b, 150, 126, 120, FLOOR - 126, P.wood); for (let x = 156; x < 268; x += 18) px.box(b, x, 130, 14, 16, P.wood2);
      px.box(b, 250, 100, 20, 20, P.metal2); px.R(b, 253, 104, 14, 5, P.dark2); px.R(b, 256, 112, 2, 4, P.ink); px.R(b, 263, 112, 2, 4, P.ink); px.R(b, 265, 102, 2, 2, P.red);
    } else if (st.variant === 'cinema') {
      for (let r = 0; r < 2; r++) for (let x = 14 + r * 8; x < 214; x += 20) { px.box(b, x, 138 + r * 18, 16, 16, r ? '#8f3c55' : '#a8475f'); px.R(b, x + 2, 140 + r * 18, 12, 3, '#c9657d'); }
    } else if (st.variant === 'classroom') {
      [40, 104].forEach(x => { px.box(b, x, 134, 50, 6, P.wood3); px.R(b, x + 4, 140, 3, 10, P.ink2); px.R(b, x + 43, 140, 3, 10, P.ink2); });

  }

  A.registerScene('infopoint', {
    width: () => 176,
    init(stage, x) { return { x, stage, variant: stage.variant || 'cafe', door: 0, solved: false, shown: [] }; },

    ending(G, st) {

      G.addActor({ look: 'kid', x: g.stand - 30, y: WD.LANE + 3, dir: 1, speed: 10, pause: 1.5, route: [[g.stand - 30, WD.LANE + 3], [st.x + 20, WD.LANE + 3]] });
    }
  });

  <script>
/* =========================================================
 * fx/audio.js — 효과음 (파일 없이 브라우저에서 직접 합성)
 * 소리는 첫 버튼을 누른 뒤부터 납니다. 화면 오른쪽 위 버튼으로 끌 수 있어요.
 * ========================================================= */
(function (A) {
  'use strict';
  let ctx = null, master = null, muted = false;

  function ensure() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.32; master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  function tone(f, t, dur, o) {
    o = o || {};
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.linearRampToValueAtTime(f + o.slide, t + dur);
    const v = o.vol == null ? 0.15 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  const SFX = {
    tap: t => tone(N(84), t, 0.05, { vol: 0.06 }),
    step: t => tone(N(60), t, 0.03, { type: 'triangle', vol: 0.04 }),
    hmm: t => { tone(N(67), t, 0.16, { type: 'triangle', vol: 0.16 }); tone(N(64), t + 0.15, 0.24, { type: 'triangle', vol: 0.14 }); },
    pop: t => { tone(N(72), t, 0.07, { vol: 0.1, slide: 380 }); tone(N(84), t + 0.06, 0.12, { vol: 0.08 }); },
    open: t => { tone(N(76), t, 0.06, { vol: 0.1 }); tone(N(83), t + 0.06, 0.06, { vol: 0.1 }); tone(N(88), t + 0.12, 0.18, { vol: 0.1 }); },
    build: t => [60, 64, 67, 72, 76].forEach((n, i) => tone(N(n), t + i * 0.08, 0.1, { vol: 0.07 })),
    item: t => { [72, 76, 79, 84].forEach((n, i) => tone(N(n), t + i * 0.09, 0.2, { type: 'triangle', vol: 0.2 })); tone(N(88), t + 0.36, 0.5, { type: 'triangle', vol: 0.16 }); },
    chime: t => { tone(N(76), t, 1.1, { type: 'sine', vol: 0.3 }); tone(N(72), t + 0.45, 1.3, { type: 'sine', vol: 0.3 }); },
    voice: t => { for (let i = 0; i < 9; i++) tone(N(57 + ((i * 7) % 5)), t + i * 0.09, 0.08, { type: 'triangle', vol: 0.07 }); },
    hop: t => tone(N(67), t, 0.12, { type: 'square', vol: 0.06, slide: 260 }),
    starAir: t => [88, 92, 95, 100].forEach((n, i) => tone(N(n), t + i * 0.05, 0.1, { vol: 0.06 })),
    bulb: t => tone(N(84), t, 0.08, { type: 'triangle', vol: 0.08 }),
    star: t => { tone(N(88), t, 0.06, { vol: 0.05 }); tone(N(95), t + 0.05, 0.1, { vol: 0.05 }); },
    door: t => { tone(N(79), t, 0.12, { type: 'sine', vol: 0.14 }); tone(N(84), t + 0.1, 0.2, { type: 'sine', vol: 0.14 }); },
    bus: t => { tone(N(50), t, 0.3, { type: 'sawtooth', vol: 0.04 }); tone(N(55), t + 0.32, 0.35, { type: 'sawtooth', vol: 0.04 }); },
    fanfare: t => {
      const seq = [[67, 0, 0.12], [67, 0.13, 0.12], [67, 0.26, 0.12], [72, 0.4, 0.5], [76, 0.95, 0.14], [74, 1.1, 0.14], [76, 1.25, 0.14], [79, 1.4, 0.8]];
      seq.forEach(s => { tone(N(s[0]), t + s[1], s[2] + 0.05, { type: 'square', vol: 0.09 }); tone(N(s[0] - 12), t + s[1], s[2] + 0.05, { type: 'triangle', vol: 0.12 }); });
    }
  };

  A.audio = {
    unlock: ensure,
    play(name) { if (muted || !SFX[name]) return; if (!ensure()) return; try { SFX[name](ctx.currentTime + 0.01); } catch (e) { /* 무시 */ } },
    setMuted(v) { muted = !!v; },
    isMuted: () => muted
  };
})(window.AAG);

/* =========================================================
 * fx/particles.js — 반짝이·음표·색종이 효과
 * ========================================================= */
(function (A) {
  'use strict';
  const P = A.pal, px = A.px;
  const COLORS = [P.yellow, P.coral, P.mint, P.blue, P.pink, '#ffffff'];

  A.particles = {
    list: [],
    clear() { this.list.length = 0; },
    spawn(x, y, kind) {
      const r = Math.random;
      const p = { x, y, kind, life: 0, vx: 0, vy: 0, g: 0 };
      if (kind === 'spark') { const a = r() * Math.PI * 2, s = 12 + r() * 26; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 10; p.g = 30; p.max = 0.5 + r() * 0.4; p.col = r() < 0.6 ? P.yellow : '#ffffff'; }
      else if (kind === 'confetti') { p.vx = (r() - 0.5) * 50; p.vy = -40 - r() * 50; p.g = 60; p.max = 2.2 + r(); p.col = COLORS[(r() * COLORS.length) | 0]; p.w = r() < 0.5 ? 2 : 1; }
      else if (kind === 'note') { p.vx = (r() - 0.5) * 10; p.vy = -18; p.max = 1.2; p.col = P.coral; }
      else { p.max = 0.6; p.col = P.yellow; }
      this.list.push(p);
    },
    burst(x, y, kind, n) { const lim = A.util.reducedMotion() ? Math.ceil(n / 3) : n; for (let i = 0; i < lim; i++) this.spawn(x, y, kind); },
    update(dt) {
      const L = this.list;
      for (let i = L.length - 1; i >= 0; i--) {
        const p = L[i];
        p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.kind === 'confetti') p.vx *= 0.98;
        if (p.life >= p.max) L.splice(i, 1);
      }
    },
    draw(b) {
      this.list.forEach(p => {
        const k = 1 - p.life / p.max;
        if (p.kind === 'spark') {
          if (k > 0.5) { px.R(b, p.x - 1, p.y, 3, 1, p.col); px.R(b, p.x, p.y - 1, 1, 3, p.col); }
          else px.R(b, p.x, p.y, 1, 1, p.col);
        } else if (p.kind === 'confetti') {
          px.R(b, p.x, p.y, p.w, Math.sin(p.life * 12) > 0 ? 2 : 1, p.col);
        } else if (p.kind === 'note') {
          b.save(); b.globalAlpha = Math.min(1, k * 2);
          A.blit(b, A.glyph('♪', p.col), p.x - 2, p.y - 4);
          b.restore();
        }
      });
    }
  };
})(window.AAG);

  <script>
/* =========================================================
 * core/engine.js — 화면 그리기·카메라·캐릭터 이동·트윈(애니메이션) 엔진
 * 게임 진행 순서는 js/game.js 가 정하고, 엔진은 "어떻게 움직일지"만 담당합니다.
 * ========================================================= */
(function (A) {
  'use strict';
  const U = A.util, P = A.pal, WD = A.WD;
  const FONTS = {
    display: "'Do Hyeon', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif",
    body: "'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif",
    pixel: "'Silkscreen', 'Courier New', monospace"
  };

  const E = A.engine = {
    time: 0, tweens: [], timers: [], actors: [], labels: [], tags: [],
    follow: false, room: null, fade: 0, box: null,
    cam: { x: 0, y: null, z: 1 }, view: {}, s: 1, VW: 240, VH: 200
  };

  /* ---------- 준비 ---------- */
  E.init = function (canvas) {
    E.canvas = canvas; E.ctx = canvas.getContext('2d');
    E.buf = document.createElement('canvas'); E.bctx = E.buf.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    let last = performance.now();
    const loop = now => {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      update(dt * (E.speed || 1)); render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  };
  function resize() {
    const r = E.canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (E.canvas.width !== w || E.canvas.height !== h) { E.canvas.width = w; E.canvas.height = h; }
    E.dpr = dpr; E.s = Math.min(h / WD.H, w / 240); E.VW = w / E.s; E.VH = h / E.s;
  }

  /* ---------- 동네 불러오기 ---------- */
  E.load = function (theme) {
    E.theme = theme;
    E.tweens.length = 0; E.timers.length = 0; E.actors.length = 0; E.tags.length = 0;
    E.room = null; E.fade = 0; E.box = null; E.follow = false;
    A.particles.clear();
    E.W = A.world.build(theme);
    E.hero = E.addActor({ look: 'hero', x: E.W.heroStart, y: WD.LANE, dir: 1 });
    E.W.scenes.forEach(sc => sc.def.setup && sc.def.setup(E, sc.st));
    E.cam = { x: E.hero.x + 70, y: null, z: 1 };
  };

  E.addActor = function (o) {
    const a = Object.assign({ x: 0, y: WD.LANE, dir: 1, alpha: 1, phase: 0, walking: false, room: null, hopY: 0 }, o);
    if (a.route) { a.ri = 0; a.rd = 1; a.x = a.route[0][0]; a.y = a.route[0][1]; a.wait = 0.4; }
    E.actors.push(a); return a;
  };
  E.sceneOf = st => E.W.scenes.find(sc => sc.st === st);
  E.enterRoom = st => { E.room = E.sceneOf(st); E.hero.room = E.room; };
  E.exitRoom = () => { E.room = null; E.hero.room = null; };

  /* ---------- 트윈·타이머 ---------- */
  E.tween = function (obj, props, ms, ease, onUpdate) {
    return new Promise(res => {
      const from = {}; Object.keys(props).forEach(k => { from[k] = obj[k]; });

    if (Math.abs(dx) > 0.3) a.dir = dx > 0 ? 1 : -1;
    a.walking = true;
    const props = { x }; if (y != null) props.y = y;

  };
  E.walkTo = (x, o) => E.walkActor(E.hero, x, (o && o.speed) || 46, o && o.y);
  E.walkPath = async function (pts, speed) { for (const p of pts) await E.walkActor(E.hero, p[0], speed, p[1]); };
  E.hopTo = async function (x, y, ms) {
    const h = E.hero; h.dir = x >= h.x ? 1 : -1; h.arcP = 0; h.arcOn = true;

  };
  E.jump = () => { E.hero.jumpT = 0.36; };
  /* 참여자가 누르는 점프 (이동 중에만, 안 눌러도 별은 자동으로 모여요) */
  E.playerJump = function () {

    E.jump(); E.sfx('hop'); return true;
  };

  /* ---------- 카메라 ---------- */
  const defaultY = z => WD.H - (E.VH / z) / 2;
  E.camTo = async function (t, ms) {

  E.showBox = async function (pos, icon) {
    E.box = { x: pos.x, y: pos.y, appear: 0, open: 0, shake: 0, icon, pow: 0 };
    E.sfx('pop');

  };
  E.shakeBox = function () { if (!E.box) return; E.box.shake = 1; E.tween(E.box, { shake: 0 }, 500, 'out'); };
  E.openBox = async function () {
    const bx = E.box; if (!bx) return;
    E.sfx('open');
    E.burst(bx.x, bx.y, 'spark', 16);
    E.tween(bx, { pow: 1 }, 200, 'out');
    await E.tween(bx, { open: 1 }, 600, 'out');
    await E.wait(250);
    await E.tween(bx, { appear: 0, pow: 0 }, 300, 'in');
    E.box = null;
  };
  function drawBox(b) {
    const bx = E.box; if (!bx || bx.appear <= 0) return;
    const t = E.time, sc = Math.max(0.01, bx.appear);
    const shake = Math.sin(t * 50) * bx.shake * 2;
    const bob = Math.round(Math.sin(t * 3) * 1.5);
    const x = Math.round(bx.x + shake), y = Math.round(bx.y + bob);
    if (bx.open <= 0) {
      // 반짝이는 테두리
      if (bx.appear >= 1 && Math.floor(t * 3) % 2 === 0) { A.px.R(b, x - 9, y - 1, 1, 2, '#ffffff'); A.px.R(b, x + 9, y - 3, 1, 2, '#ffffff'); A.px.R(b, x - 1, y - 11, 2, 1, '#ffffff'); }
      const s = A.boxSprite, w = s.width * sc, h = s.height * sc;
      b.drawImage(s, Math.round(x - w / 2), Math.round(y - h / 2), Math.round(w), Math.round(h));

      b.save(); b.globalAlpha = Math.min(1, bx.appear);
      b.drawImage(A.boxBody, x - 6, y - 3);
      b.drawImage(A.boxLid, x - 6, Math.round(y - 6 - bx.open * 7));
      const ic = A.iconSprite(bx.icon);
      b.drawImage(ic, x - 5, Math.round(y - 8 - bx.open * 16));
      b.restore();
      if (bx.pow > 0) E.label({ x: x + 16, y: y - 22, text: '뿅!', size: 9, color: P.coral, stroke: '#ffffff', alpha: bx.pow * bx.appear });

  /* ---------- 글자 라벨 (선명한 글꼴로 따로 그림) ---------- */

    c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();

    const b = E.bctx;
    b.setTransform(1, 0, 0, 1, -L, -T);
    b.imageSmoothingEnabled = false;
    b.clearRect(L, T, bw, bh);
    E.view = { left, top, L, T, bw, bh, vw, vh };
    E.labels.length = 0;

    if (E.room) E.room.def.drawRoom(b, E.room.st, E);
    else { A.world.drawBack(b, E); drawStars(b); }
    const here = E.room || null;
    E.actors.filter(a => (a.room || null) === here && !a.hidden).sort((p, q) => p.y - q.y).forEach(a => A.drawActor(b, a, E.time));

    A.particles.draw(b);
    if (!E.room) E.tags.forEach(tg => { if (tg.a > 0) E.label({ x: tg.x, y: tg.y, text: '✓ ' + tg.text, size: 7, color: '#ffffff', bg: P.mintDk, border: P.ink, pad: 2.4, bubble: 'down', alpha: tg.a, weight: 400 }); });

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.imageSmoothingEnabled = false;
    c.drawImage(E.buf, 0, 0, bw, bh, (L - left) * S, (T - top) * S, bw * S, bh * S);
    drawLabels(c, left, top, S);

    if (E.fade > 0.001) {
      const h = E.hero, hx = (h.x - left) * S, hy = (h.y - 10 - top) * S;
      const R = Math.hypot(cw, ch) * (1 - E.fade);
      c.fillStyle = '#2b2540';
      c.beginPath(); c.rect(0, 0, cw, ch);

          ? '<div class="end-btns"><button type="button" class="btn btn-go" id="campaignBtn"><span>' + esc(E.next || '우리 동네 접근성 알려주기') + '</span><span class="btn-arrow" aria-hidden="true">▶</span></button>' +
            '<button type="button" class="btn btn-soft" id="itemsBtn">' + esc(E.items) + '</button></div>'
          : '<div class="end-btns"><button type="button" class="btn btn-go" id="replayBtn"><span>' + esc(E.replay) + '</span><span class="btn-arrow" aria-hidden="true">↻</span></button>' +
            '<button type="button" class="btn btn-soft" id="itemsBtn">' + esc(E.items) + '</button></div>') +
      '</div>', 'end');
    UI.announce(E.title + ' ' + E.sub + ' ' + U.lines(E.message).join(' '));
    const main = $('#campaignBtn') || $('#replayBtn');
    setTimeout(() => main.focus({ preventScroll: true }), 150);
    if (h.onCampaign) main.addEventListener('click', () => { A.audio.play('tap'); h.onCampaign(); });
    else main.addEventListener('click', () => h.onReplay());
    $('#itemsBtn').addEventListener('click', () => UI.openItems(theme, items));
  };

  UI.openItems = function (theme, items) {
    el.modalBody.innerHTML = items.map((it, i) => {
      const stg = theme.stages[i];
      return '<li class="found-card"><div class="item-badge">' + icon(it.icon) + '</div><div class="item-text">' +
        '<p class="eyebrow">STAGE ' + (i + 1) + ' · ' + esc(stg ? stg.title : '') + '</p>' +
        '<h3 class="item-name">' + esc(it.name) + '</h3><p class="item-desc">' + br(it.desc) + '</p>' +
        (it.note ? '<p class="item-note">' + esc(it.note) + '</p>' : '') + '</div></li>';

    UI._return = document.activeElement;

    setTimeout(() => el.modal.querySelector('[data-close]').focus(), 30);
  };
  UI.closeItems = function () { el.modal.hidden = true; if (UI._return) UI._return.focus(); };

  UI.hideOverlays = function () { el.complete.hidden = true; el.toast.hidden = true; };
})(window.AAG);

  <!-- 7) 캠페인 참여 폼·Google Sheets 저장 -->
  <script>
/* =========================================================
 * campaign/sheets.js — 참여 결과를 Google Sheets(Apps Script)로 보내기
 * - 저장 주소(endpoint)가 비어 있으면 '미리보기 모드' : 아무것도 보내지 않습니다.
 * - 입력한 내용(특히 연락처)은 기기에 따로 저장하지 않습니다.
 * - 같은 응답을 두 번 보내도 시트에서는 응답ID로 한 번만 기록됩니다.
 * ========================================================= */
(function (A) {
  'use strict';
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function newId() {
    const r = Math.random().toString(36).slice(2, 8);
    return 'R' + Date.now().toString(36).toUpperCase() + r.toUpperCase();
  }
  function localTime(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  A.sheets = {
    isPreview() { return !((A.campaign && A.campaign.endpoint) || '').trim(); },

    /* 보너스 미션 결과 → 시트에 저장할 데이터
     * 화면 문구(label)와 저장값(key)을 함께 보냅니다. 집계는 key 로 하세요. */
    buildPayload(theme, s, memoryOptions, actions) {
      const C = A.campaign, now = new Date();
      const flags = list => { const o = {}; C.features.forEach(f => { o[f.key] = list.includes(f.key) ? 1 : 0; }); return o; };
      const labels = list => C.features.filter(f => list.includes(f.key)).map(f => (f.other ? '기타' : f.label));
      const mem = (memoryOptions || []).find(o => o.key === s.memory);
      const act = s.action ? ((actions || []).find(a => a.key === s.action) || null) : null;
      const place = !!s.hasPlace;
      return {
        v: 2,
        id: newId(),
        playId: (A.game && A.game.playId) || '',
        submittedAt: localTime(now),
        submittedAtISO: now.toISOString(),
        campaign: theme.campaign || theme.title,
        theme: theme.id,
        memory: s.memory || '',
        memoryLabel: mem ? mem.label : '',
        everyday: flags(s.everyday || []),
        everydayLabels: labels(s.everyday || []),
        everydayOther: s.everydayOther || '',
        hasPlace: place,
        place: place ? s.place : '',
        area: place ? s.area : '',
        placeFeatures: flags(place ? s.placeFeatures : []),
        placeFeatureLabels: place ? labels(s.placeFeatures) : [],
        placeOther: place ? (s.placeOther || '') : '',
        mission: '', missionText: '', missionSaved: false,        // 예전 '오늘의 미션' 칸(지금은 비워 둠)
        action: act ? act.key : '',
        actionLabel: act ? act.label : '',
        actionCardSaved: !!s.actionSaved,
        feedback: (s.feedback || '').slice(0, 200),
        prize: !!s.prize,
        name: s.prize ? s.name : '',
        contact: s.prize ? s.contact : '',
        consent: s.prize ? !!s.consent : false,
        consentVersion: s.prize ? (C.prize.consentVersion || '') : '',
        website: s.website || '' // 스팸 방지용 빈칸(사람은 입력하지 않음)
      };
    },

    /* 설정 탭 읽기 : 구글 시트 '설정' 탭의 체크박스(장소 추천·한마디·경품)를 게임 시작 때 받아 옵니다.
     * 못 받아 오면(인터넷 끊김 등) 이 기기에 마지막으로 받은 설정 → 그것도 없으면 파일 안의 기본값을 씁니다. */
    remote: null,
    loadSettings() {
      const KEY = 'aag.settings.v1';
      try { const c = JSON.parse(localStorage.getItem(KEY) || 'null'); if (c && typeof c === 'object') A.sheets.remote = c; } catch (e) { /* 무시 */ }
      const url = ((A.campaign && A.campaign.endpoint) || '').trim();
      if (!url || !window.fetch) return Promise.resolve(A.sheets.remote);
      const ctl = window.AbortController ? new AbortController() : null;
      const t = setTimeout(() => { if (ctl) ctl.abort(); }, 6000);
      return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'settings=1', { method: 'GET', signal: ctl ? ctl.signal : undefined })
        .then(r => r.json())
        .then(j => {
          if (j && j.settings && typeof j.settings === 'object' && Object.keys(j.settings).length) {
            A.sheets.remote = j.settings;
            try { localStorage.setItem(KEY, JSON.stringify(j.settings)); } catch (e) { /* 무시 */ }
          }
          return A.sheets.remote;
        })
        .catch(() => A.sheets.remote)
        .finally(() => clearTimeout(t));
    },

    /* 게임 기록 : 시작·완료 횟수만 보냅니다(이름·연락처 등 개인정보 없음).
     * 결과를 기다리지 않고 조용히 보내며, 실패해도 게임에는 영향이 없어요. */
    newPlayId() { return 'G' + newId().slice(1); },
    track(event, theme, playId) {
      const url = ((A.campaign && A.campaign.endpoint) || '').trim();
      const data = { type: 'play', event, playId, campaign: theme.campaign || theme.title, theme: theme.id };
      if (!url || (A.campaign && A.campaign.trackPlays === false)) {
        if (window.console) console.info('[게임 기록 · 미리보기]', data);
        return;
      }
      try {
        fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }).catch(() => {});
      } catch (e) { /* 무시 */ }
    },

    /* 보내기 : { ok, preview, unconfirmed } */
    async send(data) {
      const url = ((A.campaign && A.campaign.endpoint) || '').trim();
      if (!url) {
        if (window.console) console.info('[미리보기 모드] 저장 주소가 없어 보내지 않았어요.', data);
        await wait(500);
        return { ok: true, preview: true };
      }
      const body = JSON.stringify(data);
      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
        let j = null;
        try { j = await res.json(); } catch (e) { /* 응답이 JSON 이 아닐 수 있음 */ }
        if (j && j.ok) return { ok: true };
        if (j && j.ok === false) return { ok: false, reason: j.error };
        return { ok: res.ok };
      } catch (e) {
        // 브라우저가 응답을 읽지 못하는 경우(CORS 등) 한 번 더 보냅니다. 시트에서 응답ID로 중복을 거릅니다.
        try {
          await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
          return { ok: true, unconfirmed: true };
        } catch (e2) {
          return { ok: false };
        }
      }
    }
  };
})(window.AAG);

</script>
  <script>
/* =========================================================
 * campaign/form.js — 게임 뒤 '보너스 미션' (온라인 캠페인 참여)
 * ① 기억 → ② 발견 → ③ 작은 실천 고르기 → 나의 실천 카드
 *    (└ 보조 버튼: 편했던 장소도 알려줄게요 → 장소 기록)
 * → ④ 마무리(한마디 · 경품 — 켜진 것만, 둘 다 꺼지면 생략) → 완료
 * 문구·선택지는 js/data/campaign.js (버전별 기억·미션은 각 테마의 campaignFlow)에서 바꿉니다.
 * ========================================================= */
(function (A) {
  'use strict';
  const U = A.util, esc = U.esc;
  const br = s => U.lines(s).map(esc).join('<br>');
  const icon = (name, cls) => '<img class="' + (cls || 'px-icon') + '" src="' + A.iconURL(name, 6) + '" alt="" draggable="false">';
  let root, ctx = {};

  const F = A.campaignForm = {};
  const C = () => A.campaign;
  const flow = () => (ctx.theme && ctx.theme.campaignFlow) || {};
  const memoryOptions = () => flow().memory || C().memory.options;
  const missionList = () => flow().missions || C().mission.list;          // 예전 흐름용(기본 흐름에서는 안 씀)
  const actionList = () => flow().actions || C().action.list;
  // 우선순위 : 구글 시트 '설정' 탭 → 테마 파일 campaignFlow.modules → campaign.js modules
  const mods = () => Object.assign({ placeRecommendation: true, feedback: false, prize: true }, C().modules || {}, flow().modules || {},
    (A.sheets && A.sheets.remote && ctx.theme && A.sheets.remote[ctx.theme.id]) || {});
  const hasFinish = () => { const m = mods(); return !!(m.feedback || (m.prize && C().prize)); };
  const curAction = () => actionList().find(a => a.key === ctx.s.action) || null;

  F.open = function (theme, found, opts) {
    ctx = {
      theme, found, opts: opts || {},
      s: { memory: null, everyday: [], everydayOther: '', hasPlace: null, place: '', area: '', placeFeatures: [], placeOther: '',
        action: null, actionSaved: false, feedback: '',
        mission: null, missionSaved: false, missionRerolls: 0, prize: false, name: '', contact: '', consent: false }
    };
    root = document.getElementById('campaign');
    root.hidden = false;
    A.ui.el.complete.hidden = true;
    document.getElementById('app').setAttribute('aria-hidden', 'true');
    renderMemory();
  };
  F.close = function () {
    if (!root) return;
    root.hidden = true; root.innerHTML = '';
    document.getElementById('app').removeAttribute('aria-hidden');
  };

  /* ---------- 공통 틀 ---------- */
  function sheet(inner, announce) {
    root.innerHTML = '<div class="cp-sheet">' + inner + '</div>';
    root.querySelector('.cp-sheet').scrollTop = 0;
    requestAnimationFrame(() => { const h = root.querySelector('#cpTitle'); if (h) h.focus({ preventScroll: true }); });
    if (announce) A.ui.announce(announce);
    const back = root.querySelector('[data-back]');
    if (back) back.addEventListener('click', () => { A.audio.play('tap'); STEPS[back.dataset.back](); });
  }
  function head(step, title, lead, backTo) {
    const all = C().steps || [];
    const labels = hasFinish() ? all : all.slice(0, all.length - 1);   // 마무리(한마디·경품)가 없으면 3단계
    const pips = labels.map((l, i) => '<li class="' + (i < step ? 'is-done' : i === step ? 'is-now' : '') + '"' + (i === step ? ' aria-current="step"' : '') + '><span class="pip" aria-hidden="true"></span><span class="pip-label">' + esc(l) + '</span></li>').join('');
    return '<div class="cp-top">' +
        (backTo ? '<button type="button" class="cp-back" data-back="' + backTo + '"><span aria-hidden="true">←</span> ' + esc(C().back || '이전') + '</button>' : '<span></span>') +
        '<ol class="cp-steps" aria-label="보너스 미션 진행 ' + (step + 1) + '/' + labels.length + '">' + pips + '</ol>' +
      '</div>' +
      '<header class="cp-head">' +
        '<img class="face" src="' + A.ui.faceURL + '" alt="">' +
        '<div><p class="eyebrow">BONUS MISSION · 동네 탐험 기록</p>' +
        '<h2 id="cpTitle" tabindex="-1">' + esc(title) + '</h2>' +
        (lead ? '<p class="cp-lead">' + br(lead) + '</p>' : '') + '</div>' +
      '</header>';
  }
  const previewNote = () => A.sheets.isPreview() ? '<p class="cp-preview" role="note"><strong>미리보기 모드</strong> · 저장 주소가 연결되지 않아 입력한 내용은 어디에도 저장되지 않아요.</p>' : '';

  /* 카드형 체크 목록 (②·③-1 공용) */
  function featureTiles(prefix, checked) {
    return C().features.map((f, i) =>
      '<label class="feat"><input type="checkbox" name="' + prefix + '" value="' + esc(f.key) + '" id="' + prefix + i + '"' +
      (checked.includes(f.key) ? ' checked' : '') + (f.other ? ' data-other="1"' : '') + '>' +
      '<span class="feat-box"><span class="feat-icon">' + icon(f.icon || 'star') + '</span><span class="feat-label">' + esc(f.label) + '</span>' +
      '<span class="feat-check" aria-hidden="true"></span></span></label>').join('');
  }
  function otherField(id, value) {
    return '<div class="field other-field" id="' + id + 'Wrap"' + (value ? '' : ' hidden') + '>' +
      '<label for="' + id + '">기타 내용</label>' +
      '<input id="' + id + '" type="text" maxlength="100" autocomplete="off" value="' + esc(value || '') + '" placeholder="' + esc(C().otherPlaceholder) + '" aria-describedby="' + id + 'Err">' +
      '<p class="err" id="' + id + 'Err"></p></div>';
  }
  function bindOther(prefix, id) {
    const box = root.querySelector('input[name="' + prefix + '"][data-other]');
    if (!box) return;
    const wrap = root.querySelector('#' + id + 'Wrap');
    wrap.hidden = !box.checked;
    box.addEventListener('change', () => { wrap.hidden = !box.checked; if (box.checked) root.querySelector('#' + id).focus(); });
  }
  const checkedValues = prefix => Array.from(root.querySelectorAll('input[name="' + prefix + '"]:checked')).map(i => i.value);

  /* ---------- ① 가장 기억에 남은 것 ---------- */
  function renderMemory() {
    const M = C().memory, s = ctx.s;
    const items = (ctx.found || []).map(it => '<li>' + icon(it.icon) + '<span>' + esc(it.short || it.name) + '</span></li>').join('');
    sheet(
      head(0, M.title, M.lead) +
      '<ul class="end-items cp-found" aria-label="오늘 찾은 접근성 아이템">' + items + '</ul>' +
      '<div class="pick-grid" role="group" aria-labelledby="cpTitle">' +
        memoryOptions().map(o => '<button type="button" class="pick" data-key="' + esc(o.key) + '" aria-pressed="' + (s.memory === o.key) + '">' +
          '<span class="pick-icon">' + icon(o.icon || 'star') + '</span><span class="pick-label">' + esc(o.label) + '</span><span class="pick-check" aria-hidden="true"></span></button>').join('') +
      '</div>' + previewNote(),
      M.title
    );
    root.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
      s.memory = b.dataset.key;
      root.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      A.audio.play('pop');
      setTimeout(renderWiden, U.reducedMotion() ? 120 : 420);
    }));
  }

  /* ---------- ② 이런 것도 접근성이에요 ---------- */
  function renderWiden() {
    const W = C().widen, s = ctx.s;
    sheet(
      head(1, W.title, W.lead, 'memory') +
      '<div class="feat-grid" role="group" aria-labelledby="cpTitle">' + featureTiles('everyday', s.everyday) + '</div>' +
      otherField('cpEverydayOther', s.everydayOther) +
      '<div class="cp-actions one"><button type="button" class="btn btn-go" id="cpNext"><span>' + esc(W.next) + '</span><span class="btn-arrow" aria-hidden="true">▶</span></button></div>',
      W.title
    );
    bindOther('everyday', 'cpEverydayOther');
    root.querySelector('#cpNext').addEventListener('click', () => {
      s.everyday = checkedValues('everyday');
      s.everydayOther = s.everyday.includes('other') ? root.querySelector('#cpEverydayOther').value.trim() : '';
      A.audio.play('tap');
      renderActions();
    });
  }

  /* ---------- ③ 작은 실천 고르기 ---------- */
  function renderActions() {
    const Ac = C().action, s = ctx.s;
    sheet(
      head(2, Ac.title, Ac.lead, 'widen') +
      '<div class="pick-grid act-grid" role="group" aria-labelledby="cpTitle">' +
        actionList().map(a => '<button type="button" class="pick" data-key="' + esc(a.key) + '" aria-pressed="' + (s.action === a.key) + '">' +
          '<span class="pick-icon">' + icon(a.icon || 'star') + '</span><span class="pick-label">' + esc(a.label) + '</span><span class="pick-check" aria-hidden="true"></span></button>').join('') +
      '</div>' +
      '<p class="form-err" id="cpFormErr" role="alert"></p>' +
      '<div class="cp-actions one"><button type="button" class="btn btn-go" id="cpChoose"><span>' + esc(Ac.choose) + '</span><span class="btn-arrow" aria-hidden="true">▶</span></button></div>',
      Ac.title
    );
    const fe = root.querySelector('#cpFormErr');
    root.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
      if (s.action !== b.dataset.key) s.actionSaved = false;
      s.action = b.dataset.key; fe.textContent = '';
      root.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      A.audio.play('pop');
    }));
    root.querySelector('#cpChoose').addEventListener('click', () => {
      if (!curAction()) { fe.textContent = Ac.pickFirst; A.audio.play('hmm'); const f = root.querySelector('.pick'); if (f) f.focus(); return; }
      A.audio.play('item');
      renderCard(true);
    });
  }

  /* ---------- ③ 나의 작은 접근성 실천 카드 ---------- */
  function renderCard(fresh) {
    const Ac = C().action, s = ctx.s, a = curAction();
    const place = mods().placeRecommendation;
    sheet(
      head(2, Ac.cardTitle, '', 'actions') +
      '<div class="mission-card' + (fresh ? ' is-new' : '') + '" id="cpMissionCard">' +
        '<p class="mission-kicker">' + esc(Ac.cardKicker) + '</p>' +
        '<div class="mission-badge">' + icon(a.icon || 'star') + '</div>' +
        '<p class="mission-text">' + esc(a.label) + '</p>' +
        '<p class="mission-body">' + esc(a.desc || '') + '</p>' +
        '<p class="mission-q">' + esc(Ac.cardFoot) + '</p>' +
      '</div>' +
      '<div class="cp-actions one"><button type="button" class="btn btn-soft" id="cpSave">' + esc(Ac.save) + '</button></div>' +
      '<div class="mission-save" id="cpSaveBox" hidden></div>' +
      '<p class="form-err" id="cpFormErr" role="alert"></p>' +
      '<div class="cp-actions one"><button type="button" class="btn btn-go" id="cpNext"><span>' + esc(hasFinish() ? Ac.next : Ac.finish) + '</span><span class="btn-arrow" aria-hidden="true">▶</span></button></div>' +
      (place ? '<p class="cp-link-row"><button type="button" class="cp-link" id="cpPlaceLink">' + icon('pin', 'cp-link-icon') + '<span>' + esc(Ac.placeLink) + '</span></button></p>' : '') +
      (hasFinish() ? '' : previewNote()),
      Ac.cardTitle + '. ' + a.label + '. ' + (a.desc || '')
    );
    root.querySelector('#cpSave').addEventListener('click', () => saveMissionCard(a));
    root.querySelector('#cpNext').addEventListener('click', e => {
      s.hasPlace = false; A.audio.play('tap');
      if (hasFinish()) renderFinish(); else submit(e.currentTarget);
    });
    const pl = root.querySelector('#cpPlaceLink');
    if (pl) pl.addEventListener('click', () => { A.audio.play('pop'); renderPlace(); });
  }

  /* ---------- ③-1 장소 기록 ---------- */
  function renderPlace() {
    const Cc = C(), P = Cc.placeStep, s = ctx.s;
    const pre = s.placeFeatures.length ? s.placeFeatures : s.everyday;
    sheet(
      head(2, P.title, '', 'card') +
      '<form id="cpForm" novalidate>' +
        '<div class="field">' +
          '<label for="cpPlace">' + esc(Cc.place.label) + ' <span class="req">필수</span></label>' +
          '<input id="cpPlace" type="text" maxlength="60" autocomplete="off" value="' + esc(s.place) + '" placeholder="' + esc(Cc.place.placeholder) + '" aria-describedby="cpPlaceErr">' +
          '<p class="err" id="cpPlaceErr"></p>' +
        '</div>' +
        '<div class="field">' +
          '<label for="cpArea">' + esc(Cc.area.label) + ' <span class="req">필수</span></label>' +
          (Cc.area.help ? '<p class="field-help" id="cpAreaHelp">' + esc(Cc.area.help) + '</p>' : '') +

  /* 실천 카드 이미지 만들기 (휴대폰 사진첩에 저장해 가져갈 수 있게) */
  function saveMissionCard(a) {
    const Ac = C().action, W = 1080, H = 1350, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
    const ink = '#2f2945';
    c.fillStyle = '#79c3ec'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#dbeeef'; c.fillRect(0, H * 0.62, W, H * 0.38);
    // 카드
    const x = 70, y = 110, w = W - 140, h = H - 220;
    c.fillStyle = ink; c.fillRect(x + 12, y + 18, w, h);
    c.fillStyle = ink; c.fillRect(x - 8, y - 8, w + 16, h + 16);
    c.fillStyle = '#fff8ec'; c.fillRect(x, y, w, h);
    c.fillStyle = '#ffd76c'; c.fillRect(x, y, w, 120);
    c.fillStyle = ink; c.fillRect(x, y + 120, w, 8);
    const disp = "'Do Hyeon', 'Noto Sans KR', sans-serif", body = "'Noto Sans KR', sans-serif";
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = ink;
    c.font = "700 36px 'Silkscreen', monospace"; c.fillText(Ac.cardKicker, W / 2, y + 62);
    c.font = '66px ' + disp; c.fillText(Ac.cardTitle, W / 2, y + 205);
    // 아이콘
    const iy = y + 360;
    c.fillStyle = ink; c.beginPath(); c.arc(W / 2, iy, 100, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffd76c'; c.beginPath(); c.arc(W / 2, iy, 88, 0, Math.PI * 2); c.fill();
    c.drawImage(A.iconSprite(a.icon || 'star'), W / 2 - 65, iy - 65, 130, 130);
    // 실천 제목 · 설명 (아래 띠 위쪽 공간 안에서)
    const bottom = y + h - 190;
    let ty = iy + 170;
    c.fillStyle = ink; c.font = '60px ' + disp;
    wrap(c, a.label, w - 120).forEach(line => { c.fillText(line, W / 2, ty); ty += 78; });
    ty += 24;
    c.fillStyle = '#5b5074'; c.font = '500 36px ' + body;
    wrap(c, a.desc || '', w - 160).forEach(line => { if (ty < bottom - 60) c.fillText(line, W / 2, ty); ty += 54; });
    ty += 22;
    c.fillStyle = '#2b8f7c'; c.font = '700 34px ' + body;
    wrap(c, Ac.cardFoot, w - 140).forEach(line => { if (ty < bottom) c.fillText(line, W / 2, ty); ty += 50; });
    // 아래 띠 : 탐험가 + 게임 이름
    c.fillStyle = ink; c.fillRect(x, y + h - 160, w, 6);
    c.fillStyle = '#daf4ed'; c.fillRect(x, y + h - 154, w, 154);
    const hero = A.LOOKS.hero.stand;
    c.drawImage(hero, x + 50, y + h - 146, hero.width * 7, hero.height * 7);
    c.fillStyle = ink; c.font = '46px ' + disp; c.textAlign = 'right';
    c.fillText((ctx.theme && ctx.theme.title) || '우리 동네 접근성 모험', x + w - 50, y + h - 78);
    const url = cv.toDataURL('image/png');
    const box = root.querySelector('#cpSaveBox');
    box.hidden = false;
    box.innerHTML = '<img src="' + url + '" alt="' + esc(Ac.cardTitle) + ' 카드: ' + esc(a.label) + '"><p class="field-help">' + esc(Ac.saveHint) + '</p>';
    try { const l = document.createElement('a'); l.href = url; l.download = '나의접근성실천_' + a.key + '.png'; document.body.appendChild(l); l.click(); l.remove(); } catch (e) { /* 이미지로 저장 안내 */ }
    ctx.s.actionSaved = true;
    A.audio.play('item');
    box.scrollIntoView({ block: 'nearest', behavior: U.reducedMotion() ? 'auto' : 'smooth' });
  }
  function wrap(c, text, maxW) {
    const words = String(text).split(' '), lines = []; let cur = '';
    words.forEach(wd => {
      const t = cur ? cur + ' ' + wd : wd;
      if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = wd; } else cur = t;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  /* ---------- ④ 마무리 : 한마디 + 경품 (켜진 것만) ---------- */
  function renderFinish() {

    sheet(

              '<p class="privacy" id="cpPrivacy">' + esc(Pz.privacy) + '</p>' +

                '<label class="check"><input type="checkbox" id="cpConsent"' + (s.consent ? ' checked' : '') + ' aria-describedby="cpConsentErr"><span>' + esc(Pz.consentLabel) + '</span></label>' +
                '<p class="err" id="cpConsentErr"></p>' : '') +

          '</fieldset>' : '') +
        '<div class="hp" aria-hidden="true"><label for="cpWeb">비워 두세요</label><input id="cpWeb" type="text" tabindex="-1" autocomplete="off"></div>' +
        '<p class="form-err" id="cpFormErr" role="alert"></p>' +

      '</form>' + previewNote(),

    );
    const form = root.querySelector('#cpFinish'), fe = root.querySelector('#cpFormErr');
    const box = root.querySelector('#cpPrize');
    if (box) box.addEventListener('change', () => {
      s.prize = box.checked;

    form.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { clearErr(inp); fe.textContent = ''; }));
    form.addEventListener('submit', e => {
      e.preventDefault();
      const E = C().errors, bad = [];
      const ta = root.querySelector('#cpFeedback');
      s.feedback = ta ? ta.value.trim() : '';
      s.website = root.querySelector('#cpWeb').value;
      s.prize = !!(box && box.checked);
      if (s.prize) {
        s.name = root.querySelector('#cpName').value.trim();
        s.contact = root.querySelector('#cpContact').value.trim();
        s.consent = Pz.requireConsent ? root.querySelector('#cpConsent').checked : true;
        need(bad, s.name.length > 0, 'cpNameErr', E.name, '#cpName');
        const digits = s.contact.replace(/[^0-9]/g, '');
        need(bad, /^0\d{8,10}$/.test(digits), 'cpContactErr', E.contact, '#cpContact');
        if (Pz.requireConsent) need(bad, s.consent, 'cpConsentErr', E.consent, '#cpConsent');
        if (bad.length) { invalid(bad, fe); return; }
        s.contact = digits.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
      } else { s.name = ''; s.contact = ''; s.consent = false; }
      submit(root.querySelector('#cpSubmit'));
    });
  }

  /* ---------- 보내기 ---------- */
  async function submit(btn) {
    const fe = root.querySelector('#cpFormErr'), label = btn && btn.querySelector('.fork-label, span');
    const keep = label ? label.textContent : '';
    if (btn) { btn.disabled = true; if (label) label.textContent = '보내는 중…'; }
    const key = JSON.stringify(ctx.s);
    if (!ctx.payload || ctx.payloadKey !== key) { ctx.payload = A.sheets.buildPayload(ctx.theme, ctx.s, memoryOptions(), actionList()); ctx.payloadKey = key; }
    const r = await A.sheets.send(ctx.payload);
    if (r.ok) { A.audio.play('item'); renderDone(r); return; }
    if (btn) { btn.disabled = false; if (label) label.textContent = keep; }
    if (fe) fe.textContent = C().errors.send;
    A.audio.play('hmm');
  }

  /* ---------- 완료 ---------- */
  function renderDone(r) {
    const D = C().done, s = ctx.s;
    const a = curAction();
    const items = (ctx.found || []).map(it => '<li>' + icon(it.icon) + '<span>' + esc(it.short || it.name) + '</span></li>').join('');
    sheet(
      '<div class="cp-done">' +
        '<div class="done-badge" aria-hidden="true">' + icon('flag') + '</div>' +
        '<h2 id="cpTitle" tabindex="-1">' + esc(D.title) + '</h2>' +
        '<p class="done-key">' + br(flow().doneKey || D.key) + '</p>' +
        (a ? '<p class="done-mission">' + icon(a.icon || 'star', 'done-pin') + '<span><strong>' + esc(D.actionNote) + '</strong> “' + esc(a.label) + '”</span></p>' : '') +
        (s.hasPlace ? '<p class="done-place">' + icon('pin', 'done-pin') + '<span><strong>' + esc(s.place) + '</strong> · ' + esc(s.area) + '</span></p><p class="done-note">' + esc(D.placeNote) + '</p>' : '') +
        (s.feedback ? '<p class="done-note">' + esc(C().feedback.doneNote) + '</p>' : '') +
        (s.prize ? '<p class="done-note">경품 추첨에도 응모되었어요.</p>' : '') +
        (r && r.preview ? '<p class="cp-preview" role="note"><strong>미리보기 모드</strong> · 실제로 저장되지는 않았어요.</p>' : '') +
        '<ul class="end-items" aria-label="오늘 찾은 접근성 아이템">' + items + '</ul>' +
        '<div class="cp-actions">' +
          '<button type="button" class="btn btn-go" id="cpReplay"><span>' + esc(D.replay) + '</span><span class="btn-arrow" aria-hidden="true">↻</span></button>' +
          '<button type="button" class="btn btn-soft" id="cpShare">' + esc(D.share) + '</button>' +
        '</div>' +
        '<p class="share-msg" id="cpShareMsg" role="status"></p>' +
      '</div>',
      D.title + ' ' + U.lines(flow().doneKey || D.key).join(' ')
    );
    root.querySelector('#cpReplay').addEventListener('click', () => { F.close(); if (ctx.opts.onReplay) ctx.opts.onReplay(); });
    root.querySelector('#cpShare').addEventListener('click', share);
  }

  async function share() {
    const D = C().done, url = location.href, msg = root.querySelector('#cpShareMsg');
    const data = { title: ctx.theme.title, text: D.shareText, url };
    try { if (navigator.share) { await navigator.share(data); msg.textContent = '공유했어요!'; return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); msg.textContent = '게임 주소를 복사했어요. 메신저에 붙여 넣어 보내 보세요!'; return; } catch (e) { /* 아래로 */ }
    msg.innerHTML = '아래 주소를 길게 눌러 복사해 주세요.<br><input class="share-url" type="text" readonly value="' + esc(url) + '" aria-label="게임 주소">';
    const inp = msg.querySelector('input'); inp.focus(); inp.select();
  }

  /* ---------- 오류 표시 도구 ---------- */
  function setErr(id, msg) {
    const el = root.querySelector('#' + id); if (!el) return;
    el.textContent = msg;
    const field = el.closest('.field, fieldset');
    const input = field && field.querySelector('input[aria-describedby~="' + id + '"]');
    if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    if (field) field.classList.toggle('has-err', !!msg);
  }
  function clearErr(inp) {
    const d = (inp.getAttribute('aria-describedby') || '').split(' ').find(x => /Err$/.test(x));
    if (d) setErr(d, '');
  }
  function need(bad, ok, id, msg, sel) { setErr(id, ok ? '' : msg); if (!ok) bad.push(sel); }
  function invalid(bad, fe) {
    A.audio.play('hmm');
    const first = root.querySelector(bad[0]);
    if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center', behavior: U.reducedMotion() ? 'auto' : 'smooth' }); }
    fe.textContent = '표시된 칸을 확인해 주세요.';
  }

  const STEPS = { memory: renderMemory, widen: renderWiden, actions: renderActions, card: () => renderCard(false), place: renderPlace };
})(window.AAG);
